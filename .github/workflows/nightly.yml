# nightly.yml — screenshots.spec.js (baseline ภาพ) + a11y เต็มชุด รันคืนละครั้ง
#
# ไม่ใช่ด่านของ PR ไหนทั้งสิ้น (schedule/workflow_dispatch เท่านั้น ไม่มี
# pull_request) — screenshots.spec.js เขียนทับ baseline ภาพทุกครั้งที่รัน จึงไม่
# เหมาะกับ PR ที่รันพร้อมกันหลายอัน และ a11y เต็มชุดซ้ำกับที่งาน db ของ ci.yml
# ตรวจอยู่แล้วทุก PR (#63/#64) ตั้งใจให้ซ้ำ — จับความไม่เสถียรที่เกิดเฉพาะบน
# runner ของ GitHub ซึ่งอาจต่างจากเครื่องที่เปิด PR (#65)
#
# ล้มแล้วไม่เปิด issue อัตโนมัติ — ตัดออกจากขอบเขตเดิมของ #65 เพราะยังมีคนดู
# repo คนเดียวและอ่าน log เองอยู่แล้ว notification ของ GitHub บน scheduled
# workflow ที่ล้ม (อีเมลถึงคนที่เปิด notification ไว้) พอแล้วสำหรับตอนนี้ —
# ถ้าวันไหนกลายเป็นภาระให้กลับมาทำส่วนที่เหลือของ #65 ทีหลังได้
name: Nightly

on:
  schedule:
    # 20:00 UTC = 03:00 Asia/Bangkok — รอบดึกที่ไม่มีใครใช้ระบบอยู่
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  nightly:
    name: screenshots + a11y เต็มชุด
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # เหมือนงาน db ของ ci.yml ทุกประการ — สร้างใหม่ทุก run ไม่ใช่ฐานพัฒนา/ฐานจริง
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: suth_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: โหลด schema แล้วตามด้วย seed ของ CI
        run: |
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u root suth_ci < database/schema.sql
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u root suth_ci < database/seed_ci.sql

      - name: build ฝั่งเว็บ
        run: npm run build

      - name: ติดตั้งเบราว์เซอร์
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: สุ่ม JWT_SECRET ใหม่เฉพาะ run นี้
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: screenshots.spec.js + a11y เต็มชุด
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: suth_ci
          SUTH_E2E_START_API: "1"
          SUTH_E2E_REQUIRE_SERVICES: "1"
          SUTH_E2E_ALLOW_WRITES: "1"
        run: npm run test:e2e:nightly --workspace @suth/web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nightly
          path: apps/web/playwright-report
          retention-days: 14
