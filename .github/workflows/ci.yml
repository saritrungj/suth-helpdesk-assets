# สามชั้นของ CI ในไฟล์เดียว
#
#   verify — ไม่ต้องมีฐานข้อมูล ต้องเร็วพอที่จะเป็นด่านบังคับของทุก PR โดยไม่มีใคร
#            อยากข้าม (ชั้นแรก #66)
#   db     — ต้องมี MySQL service container จริง สร้างจาก schema.sql + seed_ci.sql
#            ใหม่ทุกครั้ง ไม่มี state ค้างข้ามรอบ (ชั้นสอง #63)
#   report — สรุปผลของสองงานข้างบนเป็น comment เดียวบน PR ที่อัปเดตทับของเดิม
#            (#65 — ไม่รวม auto-open issue เพราะยังมีคนดู repo คนเดียว
#            notification ของ GitHub บน nightly ที่ล้มก็พอแล้ว)
#
# สองงานแรกรันคู่กันทุก PR ไม่ใช่ชั้นสองรันทีหลังชั้นแรก — ถ้าต่อ API/DB ไม่ได้
# งาน db ต้องแดง ไม่ใช่เขียวแบบ skip (ดู SUTH_E2E_REQUIRE_SERVICES ใน e2e/fixtures.js)
#
# แต่ละงาน E2E รายงานผลขึ้น Checks ผ่าน dorny/test-reporter ด้วย พร้อม annotation
# ที่บรรทัดที่ล้ม — อ่านจาก junit ที่ playwright.config.js สร้างเฉพาะตอน CI=1
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # push ตามมาติดๆ ให้ยกเลิกรอบเก่า ยกเว้นบน main ที่ต้องรู้ผลของทุก commit
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify:
    name: unit, build และ E2E ที่ไม่ต้องใช้ฐานข้อมูล
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # ต้องมีประวัติถึง base ของ PR ไม่งั้น git diff --check ไม่มีอะไรให้เทียบ
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: unit ทุก workspace
        run: npm test

      - name: build ฝั่งเว็บ
        run: npm run build

      - name: ช่องว่างท้ายบรรทัดและ conflict marker ในสิ่งที่เปลี่ยน
        run: |
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "ไม่มี base ให้เทียบ (push แรกของ branch) ข้ามขั้นนี้"
            exit 0
          fi
          git diff --check "$base" HEAD

      - name: ติดตั้งเบราว์เซอร์
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # ชุดนี้ intercept /api/* ทั้งหมดผ่าน fixture จึงไม่ต้องมี API หรือฐานข้อมูล
      # Playwright สตาร์ต preview ของ build ที่เพิ่งทำเองผ่าน webServer ใน config
      - name: E2E ที่ใช้ fixture
        run: npm run test:e2e:fixture --workspace @suth/web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          # เอกสาร Playwright เตือนว่า artifact อาจมี credential ติดไปด้วย
          # 14 วันพอสำหรับไล่ดูสาเหตุ โดยไม่ต้องเก็บนานเกินจำเป็น
          retention-days: 14

      # if: always() เพราะต้องขึ้น annotation ให้เห็นแม้ตอนที่เทสล้ม — นั่นคือ
      # เวลาที่มันมีประโยชน์ที่สุด fail-on-error: false เพราะงาน verify แดงไปแล้ว
      # จากขั้นตอนเทสจริงข้างบน ไม่ต้องให้ step รายงานผลมาซ้ำสัญญาณเดิม
      - name: รายงานผล E2E ขึ้น Checks พร้อม annotation ที่บรรทัดที่ล้ม
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E · verify
          path: apps/web/test-results/e2e-junit.xml
          reporter: java-junit
          fail-on-error: false

  db:
    name: E2E ที่ต้องใช้ฐานข้อมูลจริง
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # สร้างใหม่ทุก run — schema.sql + seed_ci.sql เท่านั้น ไม่มี state ค้างข้ามรอบ
    # และไม่ใช่ฐานพัฒนา/ฐานจริงของโรงพยาบาลเลยแม้แต่น้อย
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: suth_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --default-character-set=utf8mb4 จำเป็น ไม่ใช่ตัวเลือก — ไม่ใส่แล้ว client
      # จะต่อด้วย latin1 แล้วนับความยาวชื่อแผนกภาษาไทยเป็นไบต์ ไม่ใช่ตัวอักษร ทำให้
      # ชื่อยาวจงใจ (102 ตัวอักษร) ถูกนับเกิน VARCHAR(255) ทั้งที่ไม่ได้ยาวเกินจริง
      - name: โหลด schema แล้วตามด้วย seed ของ CI (มีเคสร้ายจงใจ — ดูหมายเหตุในไฟล์)
        run: |
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u root suth_ci < database/schema.sql
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u root suth_ci < database/seed_ci.sql

      - name: build ฝั่งเว็บ
        run: npm run build

      - name: ติดตั้งเบราว์เซอร์
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # สุ่มใหม่ทุก run ด้วย openssl ไม่ใช่ค่าที่เดาได้จาก run id และไม่เคยเก็บเป็น
      # GitHub Secret เพราะไม่มีอะไรต้องคงอยู่ข้ามรอบ — ฐาน suth_ci ก็ถูกทิ้งทุกจบ job
      - name: สุ่ม JWT_SECRET ใหม่เฉพาะ run นี้
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # webServer ของ playwright.config.js สตาร์ต API เองด้วย SUTH_E2E_START_API=1
      # ต่อฐาน suth_ci ข้างบนโดยตรง ไม่ใช่ฐานพัฒนา ใช้ JWT_SECRET ที่สุ่มไว้ข้างบน
      #
      # SUTH_E2E_REQUIRE_SERVICES=1 ทำให้ reasonToSkip() โยน error แทนการข้าม —
      # ถ้าต่อ API/DB ไม่ได้ตรงนี้ workflow ต้องแดง ไม่ใช่เขียวแบบ skip (เกณฑ์ตรวจรับ #63)
      # SUTH_E2E_ALLOW_WRITES=1 ปลอดภัยเพราะฐานนี้ทิ้งทุกครั้งจบ job ไม่มีใครอ่านรายงานจากมัน
      - name: E2E ที่เหลือทั้งหมด ยกเว้น screenshots และ asset-qa48
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: suth_ci
          SUTH_E2E_START_API: "1"
          SUTH_E2E_REQUIRE_SERVICES: "1"
          SUTH_E2E_ALLOW_WRITES: "1"
        run: npm run test:e2e:db --workspace @suth/web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-db
          path: apps/web/playwright-report
          retention-days: 14

      - name: รายงานผล E2E ขึ้น Checks พร้อม annotation ที่บรรทัดที่ล้ม
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E · db
          path: apps/web/test-results/e2e-junit.xml
          reporter: java-junit
          fail-on-error: false

  report:
    name: สรุปผลขึ้น PR
    needs: [verify, db]
    # ต้องมี PR ให้ comment เท่านั้น — push ตรงเข้า main ไม่มี PR ให้แปะ
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # comment เดียวที่อัปเดตทับของเดิมทุกรอบ (header ผูกกับ workflow ไม่ใช่ commit)
      # ไม่ใช่โพสต์ใหม่ทุก push ตามเกณฑ์ตรวจรับ #65 — รายละเอียดระดับบรรทัดที่ล้ม
      # ดูได้จาก annotation ของ dorny/test-reporter ในแท็บ Checks ไม่ซ้ำไว้ในนี้
      - name: สรุปผล verify + db เป็น sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          message: |
            ### ผล CI ล่าสุด

            | งาน | ผล |
            | --- | --- |
            | `verify` (unit, build, E2E ไม่ใช้ฐานข้อมูล) | ${{ needs.verify.result == 'success' && '✅ ผ่าน' || needs.verify.result == 'skipped' && '⏭️ ข้าม' || '❌ ไม่ผ่าน' }} |
            | `db` (E2E ที่ใช้ฐานข้อมูลจริง) | ${{ needs.db.result == 'success' && '✅ ผ่าน' || needs.db.result == 'skipped' && '⏭️ ข้าม' || '❌ ไม่ผ่าน' }} |

            รายละเอียดจุดที่ล้ม (annotation ชี้บรรทัด) ดูได้จากแท็บ **Checks** ของ PR นี้
