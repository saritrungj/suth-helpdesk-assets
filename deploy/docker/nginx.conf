server {
    listen 80 default_server;
    server_name helpdesk.suth.go.th localhost 127.0.0.1;
    # Keep redirects on the browser's public origin/port, including outer TLS.
    absolute_redirect off;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        set $suth_assets_api suth-assets-api:3000;
        proxy_pass http://$suth_assets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        set $suth_assets_web suth-assets-web:80;
        proxy_pass http://$suth_assets_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
