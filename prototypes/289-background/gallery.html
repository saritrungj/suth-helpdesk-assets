<!doctype html><html lang="th"><meta charset="utf-8"><title>#289 · เลือกพื้นหลัง</title>
<style>body{margin:0;font:16px system-ui;background:#f5f5f5;color:#222}header{padding:16px 24px;background:white;border-bottom:1px solid #ddd}h1{font-size:22px;margin:0 0 8px}p{margin:4px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;padding:8px;border:1px solid #888;border-radius:6px;background:white}button[aria-pressed=true]{background:#123e46;color:white}main{padding:20px 20px 100px}img{width:100%;max-width:1440px;display:block;margin:auto;box-shadow:0 2px 18px #0002}footer{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#163c42;color:white;padding:10px;border-radius:12px;display:flex;gap:12px;align-items:center}a{color:inherit}</style>
<header><h1>พื้นหลังครีม–พีช–มิ้นต์ · #289</h1><p>แนะนำ B แสงสมดุล — สีเดียวกันทั้งสามแบบ ต่างกันที่ความเข้มและพื้นที่กระจายแสง</p><p>ภาพจากหน้าระบบจริง ใช้ข้อมูลจำลอง ไม่แก้ layout/chrome/Login · ยังไม่ใช่ผลรับรอง WCAG</p><nav><select id="page" aria-label="หน้าจอ"><option>Overview</option><option>Registry</option><option>Print Entry</option><option>Login</option></select><select id="width" aria-label="ขนาดภาพ"><option>1440</option><option>1280</option></select><select id="state" aria-label="สถานะ"><option value="normal">ปกติ</option><option value="focus">Hover / Focus (B)</option><option value="empty">ข้อมูลว่าง (B, 1440)</option><option value="error">ผิดพลาด (B, 1440)</option><option value="pending">กำลังโหลด (B, 1440)</option><option value="dark">ธีมมืด (1440)</option></select><button id="loginDark">Login ธีมมืด</button></nav></header>
<main><img id="shot" alt="ภาพตัวอย่าง"><p id="details"></p></main><footer><button id="prev" aria-label="แบบก่อนหน้า">←</button><span id="label"></span><button id="next" aria-label="แบบถัดไป">→</button><button id="before">เทียบพื้นเดิม</button><a id="full" target="_blank">เปิดภาพขนาดจริง</a></footer>
<script>const keys=['before','A','B','C'],names={before:'พื้นเดิม',A:'A · แสงนุ่มกระจาย',B:'B · แสงสมดุล (แนะนำ)',C:'C · เน้นแสงที่มุม'};let key=new URLSearchParams(location.search).get('variant')||'B',dark=false;if(!keys.includes(key))key='B';const page=document.querySelector('#page'),width=document.querySelector('#width'),state=document.querySelector('#state');function render(){const route=page.value.replaceAll(' ','-');const file=page.value==='Login'?`Login-${["error","pending"].includes(state.value)?state.value:dark?'dark':'light'}.png`:`${route}-${state.value!=="normal"&&state.value!=="focus"?"1440":width.value}-${state.value==='normal'?key:state.value}.png`;document.querySelector('#shot').src=file;document.querySelector('#full').href=file;document.querySelector('#label').textContent=names[key];document.querySelector('#details').textContent=page.value==='Login'?'Login รุ่นที่ merge แล้ว — ไม่เปลี่ยนตามแบบพื้นหลัง':`${page.value} · ${width.value} × ${width.value==='1440'?'900':'800'} · ${names[key]}`;history.replaceState(null,'','?variant='+key)}function cycle(delta){key=keys[(keys.indexOf(key)+delta+keys.length)%keys.length];render()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#before').onclick=()=>{key=key==='before'?'B':'before';render()};document.querySelector('#loginDark').onclick=()=>{page.value='Login';dark=!dark;render()};[page,width,state].forEach(el=>el.onchange=render);document.onkeydown=e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)};render()</script></html>
